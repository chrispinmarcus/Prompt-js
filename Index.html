<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock_Paper_Scissors</title>
</head>
<body>
  <script>

    let personAge = prompt("Please enter your age:");

    if (personAge < 18) {
      alert("You are too young to drive!");
    } else if (personAge > 70) {
      alert("You are too old to drive. You may need assistance.");
    } else {
      alert("You are eligible to drive!");
    }
  </script>
</body>
</html>
